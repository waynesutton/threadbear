<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git</title>
<!--
  The Git panel's page, served by the runner at /git/ (src/git-panel.ts,
  which has the API it calls and the rules it keeps). Compact, like VS Code's
  Source Control: a small icon toolbar, a message box, one button that
  changes with what's next (Commit when something's staged, then Sync or
  Publish), its chevron for the other ways to commit, and tight rows.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1d1d1f; --dim: #6e6e73; --faint: #a1a1a6; --line: rgba(0,0,0,.08);
    --hover: rgba(0,0,0,.05); --field: rgba(0,0,0,.035); --field-line: rgba(0,0,0,.13);
    --accent: #0a84ff; --accent-fg: #fff; --menu: #fff; --warn: #b26a00; --bad: #d70015; --good: #248a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --fg: #e8e8e8; --dim: #9a9a9f; --faint: #6c6c70; --line: rgba(255,255,255,.07);
      --hover: rgba(255,255,255,.06); --field: rgba(255,255,255,.04); --field-line: rgba(255,255,255,.12);
      --menu: #2a2a2c; --warn: #e5a54b; --bad: #ff6961; --good: #30d158;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 12.5px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: 8px 10px 16px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: default; opacity: .4; }
  svg { width: 14px; height: 14px; flex: none; }

  /* Toolbar: repo and branch, then icon actions. */
  .bar { display: flex; align-items: center; gap: 2px; height: 26px; margin-bottom: 6px; }
  .where { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
  .where b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .where span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
  .ib { height: 22px; min-width: 22px; padding: 0 4px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .ib:hover:not(:disabled) { background: var(--hover); color: var(--fg); }

  /* Message box. */
  .msg { position: relative; }
  textarea { display: block; width: 100%; min-height: 30px; max-height: 200px; resize: none; overflow: hidden; padding: 6px 28px 6px 8px; border-radius: 6px; border: 1px solid var(--field-line); background: var(--field); color: var(--fg); font: inherit; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .msg .ib { position: absolute; right: 3px; top: 4px; }

  /* The one button, with its chevron. */
  .go { display: flex; margin-top: 6px; height: 26px; border-radius: 6px; overflow: hidden; background: var(--accent); color: var(--accent-fg); }
  .go button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-weight: 500; }
  .go .main { flex: 1; }
  .go .more { width: 26px; border-left: 1px solid rgba(255,255,255,.25); }
  .go button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  .go.off { background: var(--field); color: var(--dim); box-shadow: inset 0 0 0 1px var(--field-line); }
  .go.off .more { border-left-color: var(--field-line); }

  .menu { position: absolute; z-index: 5; min-width: 180px; padding: 4px; border-radius: 8px; background: var(--menu); box-shadow: 0 6px 24px rgba(0,0,0,.25), 0 0 0 1px var(--field-line); }
  .menu button { display: flex; width: 100%; padding: 5px 8px; border-radius: 5px; text-align: left; gap: 8px; align-items: center; }
  .menu button:hover:not(:disabled) { background: var(--accent); color: var(--accent-fg); }
  .menu .k { margin-left: auto; color: var(--faint); font-size: 11px; }
  .menu button:hover .k { color: inherit; opacity: .8; }

  .note { margin-top: 6px; font-size: 11.5px; color: var(--dim); white-space: pre-wrap; min-height: 0; }
  .note.bad { color: var(--bad); } .note.good { color: var(--good); }

  /* Lists. */
  details { margin-top: 10px; }
  summary { list-style: none; display: flex; align-items: center; gap: 4px; height: 22px; cursor: default; user-select: none; color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
  summary::-webkit-details-marker { display: none; }
  summary .chev { transition: transform .12s; width: 10px; height: 10px; }
  details:not([open]) summary .chev { transform: rotate(-90deg); }
  summary .t { flex: 1; }
  summary .n { font-weight: 500; font-size: 10.5px; background: var(--field); border-radius: 8px; padding: 0 5px; letter-spacing: 0; }
  summary .ib { opacity: 0; }
  summary:hover .ib, summary .ib:focus-visible { opacity: 1; }

  .row { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 2px 0 16px; border-radius: 4px; }
  .row:hover { background: var(--hover); }
  .row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .dir { color: var(--faint); margin-left: 5px; font-size: 11.5px; }
  .row .ib { opacity: 0; height: 18px; min-width: 18px; }
  .row:hover .ib, .row .ib:focus-visible { opacity: 1; }
  .code { width: 12px; text-align: center; font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .code.M, .code.T, .code.R { color: var(--warn); } .code.A, .code.U, .code.C { color: var(--good); } .code.D, .code.X { color: var(--bad); }
  .empty { color: var(--faint); padding: 2px 0 2px 16px; font-size: 11.5px; }

  a.row, div.row { color: inherit; text-decoration: none; }
  .row .h { font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint); }
  .row .ago { color: var(--faint); font-size: 11px; width: 28px; text-align: right; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bar">
  <div class="where"><b id="name">…</b><span id="sub"></span></div>
  <button class="ib" id="fetch" title="Fetch: look for new commits on the remote"></button>
  <button class="ib" id="pull" title="Pull (rebase), then push: Sync"></button>
  <button class="ib" id="push" title="Push"></button>
</div>

<div class="msg">
  <textarea id="msg" rows="1" placeholder="Message (⌘↩ to commit)" spellcheck="true"></textarea>
  <button class="ib" id="gen" title="Generate a message from the staged changes (Claude Haiku)"></button>
</div>

<div class="go" id="go">
  <button class="main" id="main"></button>
  <button class="more" id="more" title="More ways to commit"></button>
</div>
<div class="note" id="note"></div>

<details id="conflictsBox" open hidden><summary><svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="t">Conflicts</span><span class="n" id="conflictsN"></span></summary><div id="conflicts"></div></details>
<details id="stagedBox" open><summary><svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="t">Staged</span><button class="ib" id="unstageAll" title="Unstage all"></button><span class="n" id="stagedN">0</span></summary><div id="staged"></div></details>
<details id="changesBox" open><summary><svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="t">Changes</span><button class="ib" id="stageAll" title="Stage all"></button><span class="n" id="changesN">0</span></summary><div id="changes"></div></details>
<details id="commitsBox" open><summary><svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="t">Commits</span></summary><div id="commits"></div></details>

<script>
const q = new URLSearchParams(location.search);
const REPO = q.get("repo"), KEY = q.get("k");
const $ = (id) => document.getElementById(id);
const I = {
  fetch: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.8v2.6h-2.6"/></svg>',
  sync: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5v9M2.8 9.3 5 11.5l2.2-2.2M11 13.5v-9M8.8 6.7 11 4.5l2.2 2.2"/></svg>',
  push: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3.5M4.5 7 8 3.5 11.5 7"/></svg>',
  spark: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M7 1.5l1.3 3.4 3.4 1.3-3.4 1.3L7 11 5.7 7.5 2.3 6.2l3.4-1.3zM12.3 9.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/></svg>',
  check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6.5"/></svg>',
  chev: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>',
  plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 8h9M8 3.5v9"/></svg>',
  minus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 8h9"/></svg>',
  spin: '<svg class="spin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2.5a5.5 5.5 0 1 1-5.5 5.5"/></svg>',
};
$("fetch").innerHTML = I.fetch; $("gen").innerHTML = I.spark; $("more").innerHTML = I.chev;
$("stageAll").innerHTML = I.plus; $("unstageAll").innerHTML = I.minus;

let S = null, busy = null, noteTimer;

async function api(op, body) {
  const r = await fetch(`/git/api/${op}` + (body ? "" : `?repo=${encodeURIComponent(REPO)}`), {
    method: body ? "POST" : "GET",
    headers: { "X-Threadbear-Git": KEY, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify({ repo: REPO, ...body }) : undefined,
  });
  const j = await r.json().catch(() => ({ ok: false, message: `HTTP ${r.status}` }));
  return j.error ? { ok: false, message: j.error } : j;
}

function note(text, kind = "") {
  clearTimeout(noteTimer);
  const n = $("note"); n.textContent = text || ""; n.className = "note " + kind;
  if (kind === "good") noteTimer = setTimeout(() => note(""), 6000);
}
const ago = (ms) => { const s = (Date.now() - ms) / 1000; return s < 60 ? "now" : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function files(list, op, emptyText) {
  if (!list.length) return `<div class="empty">${emptyText}</div>`;
  return list.map((f) => {
    const i = f.file.lastIndexOf("/"), base = f.file.slice(i + 1), dir = i > 0 ? f.file.slice(0, i) : "";
    const btn = op ? `<button class="ib" data-op="${op}" data-file="${esc(f.file)}" title="${op === "stage" ? "Stage" : "Unstage"}">${op === "stage" ? I.plus : I.minus}</button>` : "";
    return `<div class="row" title="${esc(f.file)} · ${esc(f.label)}"><span class="name">${esc(base)}<span class="dir">${esc(dir)}</span></span>${btn}<span class="code ${esc(f.code)}">${esc(f.code)}</span></div>`;
  }).join("");
}

// What the one button does now, VS Code's way.
function next() {
  if (!S) return null;
  const canPush = S.push.ok;
  if (S.staged.length) return { label: "Commit", icon: I.check, run: () => doCommit(null), on: !S.busy };
  if (S.upstream && (S.ahead || S.behind) && canPush) return { label: `Sync ${S.ahead ? `↑${S.ahead}` : ""}${S.ahead && S.behind ? " " : ""}${S.behind ? `↓${S.behind}` : ""}`, icon: I.sync, run: () => act("sync") , on: true };
  if (!S.upstream && S.unpublished && canPush) return { label: "Publish branch", icon: I.push, run: () => act("push"), on: true };
  return { label: "Commit", icon: I.check, run: () => {}, on: false };
}

function render() {
  if (!S) return;
  $("name").textContent = S.name;
  // A repo the panel won't read by itself (its own config would run something).
  if (S.problem) {
    $("sub").textContent = "";
    document.querySelectorAll("button, textarea").forEach((b) => (b.disabled = true));
    document.querySelectorAll("details").forEach((d) => (d.hidden = true));
    $("go").classList.add("off");
    $("main").innerHTML = `${I.check}<span>Commit</span>`;
    note(S.problem, "bad");
    return;
  }
  $("gen").hidden = !S.generate;
  const bits = [S.branch ?? "detached"];
  if (S.upstream) {
    if (!S.ahead && !S.behind) bits.push("up to date");
    if (S.lastFetch) bits.push(`fetched ${ago(S.lastFetch)}`);
  } else bits.push(S.remote ? "not published" : "no remote");
  if (S.busy) bits.push(`${S.busy} in progress`);
  $("sub").textContent = bits.join(" · ");

  const working = (id) => busy === id;
  $("fetch").innerHTML = working("fetch") ? I.spin : I.fetch;
  $("fetch").disabled = !!busy || !S.remote;
  $("pull").innerHTML = working("sync") ? I.spin : `${I.sync}${S.upstream && (S.ahead || S.behind) ? `${S.behind}↓ ${S.ahead}↑` : ""}`;
  $("pull").disabled = !!busy || !S.upstream || !S.push.ok;
  $("pull").title = !S.upstream ? "Publish the branch first" : S.push.ok ? "Sync: pull (rebase), then push" : S.push.why;
  $("push").innerHTML = working("push") ? I.spin : I.push;
  $("push").disabled = !!busy || !S.push.ok || !(S.upstream ? S.ahead : S.unpublished);
  $("push").title = !S.push.ok ? S.push.why : S.upstream ? (S.ahead ? `Push ${plural(S.ahead, "commit")}` : "Nothing to push") : "Publish branch";
  $("gen").innerHTML = working("generate") ? I.spin : I.spark;
  $("gen").disabled = !!busy || !S.staged.length;

  const n = next();
  $("main").innerHTML = working("main") ? `${I.spin}<span>Working…</span>` : `${n.icon}<span>${esc(n.label)}</span>`;
  $("main").disabled = !!busy || !n.on;
  $("more").disabled = !!busy || !S.staged.length;
  $("go").classList.toggle("off", !n.on && !busy);

  $("conflictsBox").hidden = !S.conflicts.length;
  $("conflictsN").textContent = S.conflicts.length;
  $("conflicts").innerHTML = files(S.conflicts, null, "");
  $("stagedN").textContent = S.staged.length;
  $("changesN").textContent = S.changes.length;
  $("staged").innerHTML = files(S.staged, "unstage", "Nothing staged");
  $("changes").innerHTML = files(S.changes, "stage", "No changes");
  $("unstageAll").disabled = !!busy || !S.staged.length;
  $("stageAll").disabled = !!busy || !S.changes.length;
  $("commits").innerHTML = S.commits.map((c) => {
    const inner = `${c.pushed ? "" : '<span class="dot" title="Not pushed"></span>'}<span class="name">${esc(c.subject)}</span><span class="h">${c.short}</span><span class="ago">${ago(c.at)}</span>`;
    return c.url ? `<a class="row" href="${esc(c.url)}" target="_blank" title="Open on the web">${inner}</a>` : `<div class="row" title="${c.pushed ? "" : "Not pushed"}">${inner}</div>`;
  }).join("") || '<div class="empty">No commits yet</div>';
}

async function refresh() {
  if (busy) return;
  const s = await api("state");
  if (s && s.repo) { S = s; render(); } else if (s && s.message) note(s.message, "bad");
}

async function act(op, body = {}, { quiet = false, spot = op } = {}) {
  busy = spot; render();
  let r;
  try { r = await api(op, body); } catch (e) { r = { ok: false, message: String(e) }; }
  busy = null;
  if (!r.ok) note(r.message || "Something went wrong.", "bad");
  else if (!quiet) note(r.message || "", "good");
  await refresh();
  return r;
}

// then: null, "push" or "sync".
async function doCommit(then) {
  const r = await act("commit", { message: $("msg").value }, { quiet: !!then, spot: "main" });
  if (!r.ok) return;
  $("msg").value = ""; grow(); localStorage.removeItem("msg:" + REPO);
  if (then) {
    const p = await act(then, {}, { quiet: true, spot: "main" });
    if (p.ok) note(`${r.message} ${p.message}`, "good");
  }
}

// The chevron's menu.
let menu = null;
function closeMenu() { menu?.remove(); menu = null; }
$("more").onclick = (e) => {
  e.stopPropagation();
  if (menu) return closeMenu();
  const canPush = S?.push.ok;
  menu = document.createElement("div");
  menu.className = "menu";
  menu.innerHTML = `
    <button data-c="">Commit<span class="k">⌘↩</span></button>
    <button data-c="push" ${canPush ? "" : "disabled"}>Commit &amp; Push<span class="k">⇧⌘↩</span></button>
    <button data-c="sync" ${canPush && S?.upstream ? "" : "disabled"}>Commit &amp; Sync</button>`;
  const r = $("go").getBoundingClientRect();
  menu.style.top = `${r.bottom + window.scrollY + 4}px`;
  menu.style.right = `${document.documentElement.clientWidth - r.right}px`;
  document.body.append(menu);
  menu.onclick = (ev) => {
    const b = ev.target.closest("button[data-c]");
    if (!b || b.disabled) return;
    closeMenu();
    doCommit(b.dataset.c || null);
  };
};
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

$("main").onclick = () => next()?.run();
$("fetch").onclick = () => act("fetch");
$("pull").onclick = () => act("sync");
$("push").onclick = () => act("push");
$("stageAll").onclick = (e) => { e.preventDefault(); act("stage", { all: true }, { quiet: true, spot: "list" }); };
$("unstageAll").onclick = (e) => { e.preventDefault(); act("unstage", { all: true }, { quiet: true, spot: "list" }); };
$("gen").onclick = async () => {
  if ($("msg").value.trim() && !confirm("Replace your message with a generated one?")) return;
  const r = await act("generate", {}, { quiet: true });
  if (r.ok) { $("msg").value = r.text; grow(); save(); $("msg").focus(); }
};
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-op]");
  if (b) act(b.dataset.op, { files: [b.dataset.file] }, { quiet: true, spot: "list" });
});

const grow = () => { const t = $("msg"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, 200) + "px"; t.style.overflow = t.scrollHeight > 200 ? "auto" : "hidden"; };
const save = () => localStorage.setItem("msg:" + REPO, $("msg").value);
$("msg").value = localStorage.getItem("msg:" + REPO) || "";
$("msg").addEventListener("input", () => { grow(); save(); });
$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.metaKey && S?.staged.length && !busy) { e.preventDefault(); doCommit(e.shiftKey && S.push.ok ? "push" : null); }
});
grow();

if (!REPO || !KEY) note("Open this from a thread's Git panel.", "bad");
else {
  refresh();
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 3000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
}
</script>
</body>
</html>
