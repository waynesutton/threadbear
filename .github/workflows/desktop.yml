# The GPUI desktop app (desktop/: the runner connection and the app) on
# Linux, Mac and Windows: every Rust test (including signing in to the mock
# runner), the behaviour specs in features/ against a real window, and a build
# for each to download from the run's artifacts.
# Nothing is signed: the Mac app needs right-click Open the first time, and
# Windows SmartScreen asks once.
#
# tb land holds a landing that changes what this checks while its last run on
# main failed (runner/src/land-gate.ts, docs/thread-worktrees.md): it was red
# for two days of GPUI landings (10 to 12 Nov) over what only GitHub's Macs,
# Linux and Windows see, which tb land's quick check on Tinker Desk can't.
# tb land: hold while red
name: Desktop app

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - runner/src/protocol.ts
      - runner/src/rpc-auth.ts
      - web/src/sections.ts
      - web/src/format.ts
      - app/Tools/mock-runner/**
      - features/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - runner/src/protocol.ts
      - runner/src/rpc-auth.ts
      - web/src/sections.ts
      - web/src/format.ts
      - app/Tools/mock-runner/**
      - features/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

# A PR's newer push cancels its run in progress. Main's don't: on 12 Nov main
# was pushed about every 7 minutes, each run takes about 40, and every run was
# cancelled by the next, so main went hours with no verdict and tb land's gate
# held on an old red one. Now main's runs go one at a time; GitHub keeps one
# waiting per group and a newer push replaces it, so a busy morning batches
# into the newest commit rather than piling up Mac and Windows minutes.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Mac, os: macos-26 }
          - { name: Windows, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux libraries
        if: runner.os == 'Linux'
        # xvfb, mesa and dbus are for the behaviour specs: a window with no screen.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libvulkan-dev xvfb mesa-vulkan-drivers dbus-x11
      - name: Install the mock runner and the specs
        run: |
          npm ci --prefix app/Tools/mock-runner
          npm ci --prefix features
      - name: The specs line up with their steps
        working-directory: features
        run: node verify-pairing.mjs
      - name: Rust tests (with the mock runner)
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Behaviour specs
        run: |
          cargo build --manifest-path desktop/Cargo.toml -p threadbear-gpui --features automation
          cd features
          TB_APP=gpui TB_RETRY=1 node_modules/.bin/cucumber-js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-reports-${{ matrix.name }}
          path: features/reports/
          if-no-files-found: ignore
      - name: Build the GPUI app
        run: cargo build --release --manifest-path desktop/Cargo.toml -p threadbear-gpui
      - uses: actions/upload-artifact@v4
        with:
          name: threadbear-desktop-${{ matrix.name }}
          path: |
            desktop/target/release/threadbear-gpui
            desktop/target/release/threadbear-gpui.exe
          if-no-files-found: error
