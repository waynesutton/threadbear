# The Hetzner box has 8 GB and 4 cores, and a bigger Android build ran it
# out of memory: one heap, Kotlin compiled in it (no Kotlin daemon), two
# workers. build.sh also runs Gradle under a 5.5 GB memory cap.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
