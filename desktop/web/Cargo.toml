[package]
name = "threadbear-web"
version = "0.1.0"
description = "The web runtime for Threadbear's GPUI app: CEF fetched on first use, started from the app's data folder, and the pages it shows"
edition = "2021"
publish = false

[dependencies]
threadbear-core = { path = "../core" }
serde_json = "1"
# The runtime's download (src/download.rs): a plain blocking GET on a thread of
# its own, over rustls with ring and the Mozilla roots built in, so no
# OpenSSL or system library is needed. The pinned hashes are what make the
# download trustworthy; TLS keeps it private. The version download-cef uses
# against the same CDN.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
# The pictures and DevTools answers handed back to the app (src/mac/devtools.rs).
# Already in the build through GPUI, at this version.
futures = "=0.3.34"

[target.'cfg(target_os = "macos")'.dependencies]
# cef-rs (tauri-apps/cef-rs, MIT or Apache-2.0): Rust bindings to CEF's C API,
# at the version Ghostex's Mac path and the gpui-web-spike branch run:
# 156.3.0+156.0.15, made from CEF 156.0.15, which is desktop/core's
# CEF_VERSION (Cargo ignores the +156.0.15 in a requirement, so it's written
# here instead; Cargo.lock has it). No default features: its bundling tool and
# resource helpers aren't wanted.
cef = { version = "=156.3.0", default-features = false }
# Pinned too, or Cargo takes a newer sys crate and with it another CEF than
# the bindings above. `dox` turns its build script off: that script downloads
# CEF and builds a C++ wrapper with cmake and ninja on every machine that
# builds the app, and src/mac/loader.rs does the wrapper's one job on a Mac
# instead (scripts/gen-loader.mjs says how).
cef-dll-sys = { version = "=156.3.0", features = ["dox"] }
# dlopen and dlsym for the loader. Already in the build at this version.
libc = "=0.2.191"

[build-dependencies]
# Compiles native/appkit_hooks.m on a Mac. Already in the build.
cc = "=1.11.0"
